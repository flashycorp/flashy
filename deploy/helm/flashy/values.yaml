imageRegistry: ""   # <account>.dkr.ecr.eu-central-1.amazonaws.com

backend:
  image: flashy-backend
  tag: latest
  replicas: 2
  port: 8080
  envFromSecret: flashy-backend-env
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

frontend:
  image: flashy-frontend
  tag: latest
  replicas: 2
  port: 80

ingress:
  enabled: true
  className: nginx
  host: flashy.app
  apiHost: api.flashy.app
  tls: true
