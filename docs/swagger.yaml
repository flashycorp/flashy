openapi: 3.0.3
info:
  title: Flashy API
  version: 1.0.0
  description: |
    REST API сервісу **Flashy** — вивчення іноземної лексики та граматики за допомогою
    карткового формату та інтервальних повторень (SRS).

    ## Ролі
    * **Guest** — без авторизації (інфо-сторінки, публічний каталог, демо-тренування).
    * **User** — зареєстрований користувач.
    * **Admin** — адміністратор / підтримка (успадковує права User).

    ## Автентифікація
    * Веб: сесійна cookie `flashy_session` (`cookieAuth`).
    * Мобільний застосунок: Bearer-токен сесії (`bearerAuth`).
    * Вхід через Google OAuth 2.0 та QR-код (короткоживучі одноразові токени).

    ## SRS (початкові інтервали)
    `again` → 5 хв, `hard` → 15 хв, `good` → 1 год, `easy` → 4 дні.
  contact:
    name: Flashy Team
servers:
  - url: https://api.flashy.app/v1
    description: Production (AWS)
  - url: http://localhost:8080/v1
    description: Local development

tags:
  - name: Auth
    description: Реєстрація, вхід, Google OAuth, QR-вхід
  - name: Demo
    description: Демо-режим для гостей
  - name: Profile
    description: Профіль та налаштування користувача
  - name: Decks
    description: Колоди користувача
  - name: Cards
    description: Картки
  - name: Tags
    description: Теги
  - name: Study
    description: SRS-тренування
  - name: Stats
    description: Статистика та прогрес
  - name: Catalog
    description: Публічний каталог колод
  - name: ImportExport
    description: Експорт та імпорт колод
  - name: Notifications
    description: Push-повідомлення та пристрої
  # - name: Support
  #   description: Звернення до служби підтримки
  - name: Admin
    description: Адміністрування та модерація
  - name: System
    description: Службові ендпоінти

paths:
  # ───────────────────────── System ─────────────────────────
  /health:
    get:
      tags: [System]
      summary: Перевірка стану сервісу
      security: []
      responses:
        '200':
          description: Сервіс працює
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  version: { type: string, example: 1.0.0 }

  /info/faq:
    get:
      tags: [System]
      summary: FAQ та інформація про продукт (Guest)
      security: []
      parameters:
        - name: lang
          in: query
          schema: { $ref: '#/components/schemas/UiLanguage' }
      responses:
        '200':
          description: Інформаційний контент
          content:
            application/json:
              schema:
                type: object
                properties:
                  about: { type: string }
                  features:
                    type: array
                    items: { type: string }
                  faq:
                    type: array
                    items:
                      type: object
                      properties:
                        question: { type: string }
                        answer: { type: string }

  # ───────────────────────── Auth ─────────────────────────
  /auth/register:
    post:
      tags: [Auth]
      summary: Реєстрація через email та пароль
      description: Якщо передано `demoSessionId`, прогрес демо-тренування переноситься в новий акаунт.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Акаунт створено, сесію розпочато
          headers:
            Set-Cookie:
              description: Сесійна cookie `flashy_session`
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: Email вже зареєстровано
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /auth/login:
    post:
      tags: [Auth]
      summary: Вхід через email та пароль
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Успішний вхід
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Акаунт заблоковано
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Вихід (завершення сесії)
      responses:
        '204':
          description: Сесію завершено
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/google:
    get:
      tags: [Auth]
      summary: Початок Google OAuth 2.0
      description: Перенаправляє користувача на сторінку згоди Google.
      security: []
      parameters:
        - name: demoSessionId
          in: query
          description: Демо-сесія для перенесення прогресу
          schema: { type: string, format: uuid }
      responses:
        '302':
          description: Редірект на Google
          headers:
            Location:
              schema: { type: string, format: uri }

  /auth/google/callback:
    get:
      tags: [Auth]
      summary: Callback Google OAuth 2.0
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema: { type: string }
        - name: state
          in: query
          required: true
          schema: { type: string }
      responses:
        '302':
          description: Успішна авторизація, редірект до застосунку
          headers:
            Set-Cookie:
              schema: { type: string }
            Location:
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }

  /auth/qr/sessions:
    post:
      tags: [Auth]
      summary: Створити QR-сесію входу (веб)
      description: Повертає короткоживучий одноразовий токен для відображення у вигляді QR-коду.
      security: []
      responses:
        '201':
          description: QR-сесію створено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QrSession' }

  /auth/qr/sessions/{token}:
    get:
      tags: [Auth]
      summary: Статус QR-сесії (polling з веб-клієнта)
      description: Після підтвердження з мобільного застосунку встановлює сесійну cookie.
      security: []
      parameters:
        - $ref: '#/components/parameters/QrToken'
      responses:
        '200':
          description: Поточний статус
          headers:
            Set-Cookie:
              description: Встановлюється лише при status=confirmed
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [pending, confirmed, expired]
                  user: { $ref: '#/components/schemas/User' }
        '404': { $ref: '#/components/responses/NotFound' }

  /auth/qr/sessions/{token}/confirm:
    post:
      tags: [Auth]
      summary: Підтвердити QR-вхід (мобільний застосунок)
      description: Викликається авторизованим мобільним застосунком після сканування QR-коду. Токен одноразовий.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/QrToken'
      responses:
        '204':
          description: Вхід підтверджено
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410':
          description: Токен прострочено або вже використано
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/mobile/token:
    post:
      tags: [Auth]
      summary: Отримати Bearer-токен для мобільного застосунку
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/LoginRequest'
                - type: object
                  properties:
                    deviceName: { type: string, example: iPhone 15 }
      responses:
        '200':
          description: Токен видано
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken: { type: string }
                  expiresAt: { type: string, format: date-time }
                  user: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ───────────────────────── Demo ─────────────────────────
  /demo/deck:
    get:
      tags: [Demo]
      summary: Демо-колода (5 готових карток)
      security: []
      responses:
        '200':
          description: Демо-колода
          content:
            application/json:
              schema:
                type: object
                properties:
                  deck: { $ref: '#/components/schemas/Deck' }
                  cards:
                    type: array
                    maxItems: 5
                    items: { $ref: '#/components/schemas/Card' }

  /demo/sessions:
    post:
      tags: [Demo]
      summary: Розпочати демо-тренування
      security: []
      responses:
        '201':
          description: Демо-сесію створено
          content:
            application/json:
              schema:
                type: object
                properties:
                  demoSessionId: { type: string, format: uuid }
                  expiresAt: { type: string, format: date-time }

  /demo/sessions/{demoSessionId}/reviews:
    post:
      tags: [Demo]
      summary: Зберегти оцінку картки в демо-тренуванні
      security: []
      parameters:
        - name: demoSessionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewRequest' }
      responses:
        '200':
          description: Результат розрахунку SRS (зберігається тимчасово)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewResult' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────── Profile ─────────────────────────
  /users/me:
    get:
      tags: [Profile]
      summary: Поточний профіль
      responses:
        '200':
          description: Профіль
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Profile]
      summary: Редагувати профіль
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProfileRequest' }
      responses:
        '200':
          description: Профіль оновлено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: Email вже використовується
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /users/me/password:
    put:
      tags: [Profile]
      summary: Змінити пароль
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, format: password }
                newPassword: { type: string, format: password, minLength: 8 }
      responses:
        '204':
          description: Пароль змінено
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ───────────────────────── Decks ─────────────────────────
  /decks:
    get:
      tags: [Decks]
      summary: Список власних колод
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: tag
          in: query
          description: Фільтр за тегом
          schema: { type: string }
        - name: q
          in: query
          description: Пошук за назвою
          schema: { type: string }
      responses:
        '200':
          description: Колоди користувача
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Deck' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Decks]
      summary: Створити колоду
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeckInput' }
      responses:
        '201':
          description: Колоду створено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Deck' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /decks/{deckId}:
    parameters:
      - $ref: '#/components/parameters/DeckId'
    get:
      tags: [Decks]
      summary: Отримати колоду
      responses:
        '200':
          description: Колода
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Deck' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Decks]
      summary: Редагувати / перейменувати колоду
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeckInput' }
      responses:
        '200':
          description: Колоду оновлено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Deck' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Decks]
      summary: Видалити колоду
      responses:
        '204':
          description: Колоду видалено
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────── Cards ─────────────────────────
  /decks/{deckId}/cards:
    parameters:
      - $ref: '#/components/parameters/DeckId'
    get:
      tags: [Cards]
      summary: Список карток колоди
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: state
          in: query
          description: Фільтр за станом вивчення
          schema: { $ref: '#/components/schemas/CardState' }
        - name: tag
          in: query
          schema: { type: string }
        - name: q
          in: query
          description: Пошук за терміном або перекладом
          schema: { type: string }
      responses:
        '200':
          description: Картки
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Card' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Cards]
      summary: Додати картку до колоди
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CardInput' }
      responses:
        '201':
          description: Картку створено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Card' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /decks/{deckId}/cards/bulk:
    parameters:
      - $ref: '#/components/parameters/DeckId'
    post:
      tags: [Cards]
      summary: Пакетне додавання карток
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cards]
              properties:
                cards:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items: { $ref: '#/components/schemas/CardInput' }
      responses:
        '201':
          description: Картки створено
          content:
            application/json:
              schema:
                type: object
                properties:
                  created: { type: integer }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Card' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /cards/{cardId}:
    parameters:
      - $ref: '#/components/parameters/CardId'
    get:
      tags: [Cards]
      summary: Отримати картку
      responses:
        '200':
          description: Картка
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Card' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Cards]
      summary: Редагувати картку
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CardInput' }
      responses:
        '200':
          description: Картку оновлено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Card' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Cards]
      summary: Видалити картку
      responses:
        '204':
          description: Картку видалено
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────── Tags ─────────────────────────
  /tags:
    get:
      tags: [Tags]
      summary: Список тегів користувача
      responses:
        '200':
          description: Теги
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Tag' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Tags]
      summary: Створити тег
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 50 }
      responses:
        '201':
          description: Тег створено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tag' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: Тег уже існує
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /tags/{tagId}:
    parameters:
      - name: tagId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [Tags]
      summary: Видалити тег
      responses:
        '204':
          description: Тег видалено
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────── Study ─────────────────────────
  /decks/{deckId}/study/queue:
    parameters:
      - $ref: '#/components/parameters/DeckId'
    get:
      tags: [Study]
      summary: Черга карток до повторення
      description: Повертає картки, час повторення яких настав, та нові картки (до ліміту).
      parameters:
        - name: mode
          in: query
          schema: { $ref: '#/components/schemas/StudyMode' }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 20 }
      responses:
        '200':
          description: Черга
          content:
            application/json:
              schema:
                type: object
                properties:
                  mode: { $ref: '#/components/schemas/StudyMode' }
                  dueCount: { type: integer }
                  newCount: { type: integer }
                  cards:
                    type: array
                    items: { $ref: '#/components/schemas/StudyCard' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /study/sessions:
    post:
      tags: [Study]
      summary: Розпочати сесію тренування
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deckId, mode]
              properties:
                deckId: { type: string, format: uuid }
                mode: { $ref: '#/components/schemas/StudyMode' }
      responses:
        '201':
          description: Сесію створено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudySession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    get:
      tags: [Study]
      summary: Незавершені сесії (відновлення після втрати з'єднання)
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, finished]
            default: active
      responses:
        '200':
          description: Список сесій
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/StudySession' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /study/sessions/{sessionId}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [Study]
      summary: Стан сесії тренування (проміжний прогрес)
      responses:
        '200':
          description: Сесія
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudySession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /study/sessions/{sessionId}/reviews:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [Study]
      summary: Надіслати оцінку картки
      description: |
        Приймає відповідь/оцінку, перераховує SRS-інтервал та повертає наступну дату показу.
        Запит ідемпотентний за `clientReviewId` — безпечний для повторної відправки після втрати з'єднання.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewRequest' }
      responses:
        '200':
          description: Результат розрахунку
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Сесію вже завершено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /study/sessions/{sessionId}/finish:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [Study]
      summary: Завершити сесію
      responses:
        '200':
          description: Підсумок сесії
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudySession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /cards/{cardId}/choices:
    parameters:
      - $ref: '#/components/parameters/CardId'
    get:
      tags: [Study]
      summary: 4 варіанти відповіді для режиму «Тест»
      responses:
        '200':
          description: Варіанти (один правильний)
          content:
            application/json:
              schema:
                type: object
                properties:
                  cardId: { type: string, format: uuid }
                  options:
                    type: array
                    minItems: 4
                    maxItems: 4
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        text: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────── Stats ─────────────────────────
  /stats/overview:
    get:
      tags: [Stats]
      summary: Загальний прогрес (streak, % засвоєного)
      responses:
        '200':
          description: Огляд
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatsOverview' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /stats/activity:
    get:
      tags: [Stats]
      summary: Активність за період (дані для графіків)
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: Денна активність
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    date: { type: string, format: date }
                    reviews: { type: integer }
                    correct: { type: integer }
                    newCards: { type: integer }
                    timeSpentSec: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /stats/decks/{deckId}:
    parameters:
      - $ref: '#/components/parameters/DeckId'
    get:
      tags: [Stats]
      summary: Детальна статистика колоди
      responses:
        '200':
          description: Статистика колоди
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeckStats' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────── Catalog ─────────────────────────
  /catalog/decks:
    get:
      tags: [Catalog]
      summary: Публічний каталог колод
      description: Доступний гостям. Пошук, фільтрація та сортування.
      security: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: q
          in: query
          schema: { type: string }
        - name: sourceLanguage
          in: query
          schema: { type: string, example: en }
        - name: targetLanguage
          in: query
          schema: { type: string, example: uk }
        - name: sort
          in: query
          schema:
            type: string
            enum: [popular, rating, newest]
            default: popular
      responses:
        '200':
          description: Публічні колоди
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/CatalogDeck' }
                  pagination: { $ref: '#/components/schemas/Pagination' }

  /catalog/decks/{catalogDeckId}:
    parameters:
      - $ref: '#/components/parameters/CatalogDeckId'
    get:
      tags: [Catalog]
      summary: Деталі публічної колоди
      security: []
      responses:
        '200':
          description: Колода з прикладами карток
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CatalogDeck'
                  - type: object
                    properties:
                      previewCards:
                        type: array
                        items: { $ref: '#/components/schemas/Card' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Catalog]
      summary: Зняти власну колоду з публікації
      responses:
        '204':
          description: Колоду знято з публікації
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /catalog/decks/{catalogDeckId}/copy:
    parameters:
      - $ref: '#/components/parameters/CatalogDeckId'
    post:
      tags: [Catalog]
      summary: Скопіювати публічну колоду у власну колекцію
      responses:
        '201':
          description: Копію створено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Deck' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /catalog/decks/{catalogDeckId}/rating:
    parameters:
      - $ref: '#/components/parameters/CatalogDeckId'
    put:
      tags: [Catalog]
      summary: Оцінити колоду
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value: { type: integer, minimum: 1, maximum: 5 }
      responses:
        '200':
          description: Оцінку збережено
          content:
            application/json:
              schema:
                type: object
                properties:
                  ratingAvg: { type: number, format: float }
                  ratingCount: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Catalog]
      summary: Видалити власну оцінку
      responses:
        '204':
          description: Оцінку видалено
        '401': { $ref: '#/components/responses/Unauthorized' }

  /catalog/decks/{catalogDeckId}/favorite:
    parameters:
      - $ref: '#/components/parameters/CatalogDeckId'
    put:
      tags: [Catalog]
      summary: Додати в уподобані
      responses:
        '204':
          description: Додано
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Catalog]
      summary: Прибрати з уподобаних
      responses:
        '204':
          description: Прибрано
        '401': { $ref: '#/components/responses/Unauthorized' }

  # /catalog/decks/{catalogDeckId}/report:
  #   parameters:
  #     - $ref: '#/components/parameters/CatalogDeckId'
  #   post:
  #     tags: [Catalog]
  #     summary: Поскаржитися на колоду
  #     requestBody:
  #       required: true
  #       content:
  #         application/json:
  #           schema:
  #             type: object
  #             required: [reason]
  #             properties:
  #               reason:
  #                 type: string
  #                 enum: [spam, offensive, copyright, other]
  #               comment: { type: string, maxLength: 1000 }
  #     responses:
  #       '201':
  #         description: Скаргу створено
  #       '401': { $ref: '#/components/responses/Unauthorized' }
  #       '404': { $ref: '#/components/responses/NotFound' }

  /users/me/favorites:
    get:
      tags: [Catalog]
      summary: Уподобані публічні колоди
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Уподобані колоди
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/CatalogDeck' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /decks/{deckId}/publish:
    parameters:
      - $ref: '#/components/parameters/DeckId'
    post:
      tags: [Catalog]
      summary: Опублікувати власну колоду в каталозі
      responses:
        '201':
          description: Колоду опубліковано
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogDeck' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Колода вже опублікована
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ───────────────────────── Import / Export ─────────────────────────
  /decks/{deckId}/export:
    parameters:
      - $ref: '#/components/parameters/DeckId'
    get:
      tags: [ImportExport]
      summary: Експорт колоди у власному форматі Flashy
      responses:
        '200':
          description: Файл колоди
          headers:
            Content-Disposition:
              schema: { type: string, example: 'attachment; filename="deck.flashy.json"' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeckExport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /decks/import:
    post:
      tags: [ImportExport]
      summary: Імпорт колоди з файлу формату Flashy
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
          application/json:
            schema: { $ref: '#/components/schemas/DeckExport' }
      responses:
        '201':
          description: Колоду імпортовано
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Deck' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413':
          description: Файл завеликий
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ───────────────────────── Notifications ─────────────────────────
  /devices:
    post:
      tags: [Notifications]
      summary: Зареєструвати пристрій для push (FCM)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fcmToken, platform]
              properties:
                fcmToken: { type: string }
                platform:
                  type: string
                  enum: [ios, android]
                deviceName: { type: string }
      responses:
        '201':
          description: Пристрій зареєстровано
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /devices/{deviceId}:
    parameters:
      - name: deviceId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [Notifications]
      summary: Видалити пристрій
      responses:
        '204':
          description: Пристрій видалено
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /users/me/notification-settings:
    get:
      tags: [Notifications]
      summary: Налаштування нагадувань
      responses:
        '200':
          description: Налаштування
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [Notifications]
      summary: Оновити налаштування нагадувань
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationSettings' }
      responses:
        '200':
          description: Збережено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }

