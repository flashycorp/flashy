  # ───────────────────────── Admin ─────────────────────────
  /admin/users:
    get:
      tags: [Admin]
      summary: Список користувачів
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: q
          in: query
          description: Пошук за email/ім'ям
          schema: { type: string }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/AccountStatus' }
      responses:
        '200':
          description: Користувачі
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/User' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/users/{userId}/status:
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Admin]
      summary: Заблокувати / розблокувати акаунт
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/AccountStatus' }
                reason: { type: string }
      responses:
        '200':
          description: Статус змінено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

