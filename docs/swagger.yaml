# ═════════════════════════ Components ═════════════════════════
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: flashy_session
      description: Сесійна cookie (веб-клієнт)
    bearerAuth:
      type: http
      scheme: bearer
      description: Токен сесії (мобільний застосунок)

  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    DeckId:
      name: deckId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CardId:
      name: cardId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CatalogDeckId:
      name: catalogDeckId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TicketId:
      name: ticketId
      in: path
      required: true
      schema: { type: string, format: uuid }
    QrToken:
      name: token
      in: path
      required: true
      schema: { type: string }

  responses:
    BadRequest:
      description: Некоректний запит
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Користувач не авторизований
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Недостатньо прав
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Ресурс не знайдено
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: Помилка валідації
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationError' }
    TooManyRequests:
      description: Забагато запитів
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    # ── common ──
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: not_found }
        message: { type: string, example: Resource not found }
    ValidationError:
      type: object
      required: [code, message, fields]
      properties:
        code: { type: string, example: validation_failed }
        message: { type: string }
        fields:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
    Pagination:
      type: object
      properties:
        page: { type: integer }
        pageSize: { type: integer }
        totalItems: { type: integer }
        totalPages: { type: integer }

    # ── enums ──
    Role:
      type: string
      enum: [user, admin]
    AccountStatus:
      type: string
      enum: [active, blocked]
    UiLanguage:
      type: string
      enum: [uk, en]
    Theme:
      type: string
      enum: [light, dark]
    StudyMode:
      type: string
      description: "cards — Flip-картки, quiz — вибір із 4 варіантів, writing — ручне введення"
      enum: [cards, quiz, writing]
    Rating:
      type: string
      enum: [again, hard, good, easy]
    CardState:
      type: string
      enum: [new, learning, review, mastered]
    TicketStatus:
      type: string
      enum: [open, in_progress, resolved, closed]
    TicketCategory:
      type: string
      enum: [login, lost_data, bug, feature_request, complaint, other]

    # ── auth / user ──
    RegisterRequest:
      type: object
      required: [name, surname, email, password]
      properties:
        name: { type: string, maxLength: 100, example: Арсеній }
        surname: { type: string, maxLength: 100, example: Дмитрієв }
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 8 }
        demoSessionId:
          type: string
          format: uuid
          description: Демо-сесія для перенесення прогресу
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
    AuthResponse:
      type: object
      properties:
        user: { $ref: '#/components/schemas/User' }
        accessToken:
          type: string
          description: Лише для мобільних клієнтів
    QrSession:
      type: object
      properties:
        token: { type: string, description: Одноразовий токен для QR-коду }
        qrPayload: { type: string, example: 'flashy://qr-login?token=abc123' }
        expiresAt: { type: string, format: date-time }
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        surname: { type: string }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }
        status: { $ref: '#/components/schemas/AccountStatus' }
        authProvider:
          type: string
          enum: [password, google]
        learningLanguages:
          type: array
          items: { type: string, example: en }
        uiLanguage: { $ref: '#/components/schemas/UiLanguage' }
        theme: { $ref: '#/components/schemas/Theme' }
        createdAt: { type: string, format: date-time }
    UpdateProfileRequest:
      type: object
      properties:
        name: { type: string }
        surname: { type: string }
        email: { type: string, format: email }
        learningLanguages:
          type: array
          items: { type: string }
        uiLanguage: { $ref: '#/components/schemas/UiLanguage' }
        theme: { $ref: '#/components/schemas/Theme' }

    # ── decks / cards ──
    Tag:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    DeckInput:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 150, example: English B1 Verbs }
        description: { type: string, maxLength: 1000 }
        sourceLanguage: { type: string, example: en }
        targetLanguage: { type: string, example: uk }
        tags:
          type: array
          items: { type: string }
    Deck:
      type: object
      properties:
        id: { type: string, format: uuid }
        ownerId: { type: string, format: uuid, nullable: true }
        name: { type: string }
        description: { type: string }
        sourceLanguage: { type: string }
        targetLanguage: { type: string }
        tags:
          type: array
          items: { $ref: '#/components/schemas/Tag' }
        cardCount: { type: integer }
        dueCount: { type: integer }
        kind:
          type: string
          enum: [personal, official, demo, copied]
        isPublished: { type: boolean }
        copiedFromId: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CardInput:
      type: object
      required: [term, translation]
      properties:
        term: { type: string, maxLength: 500, example: ubiquitous }
        translation: { type: string, maxLength: 500, example: всюдисущий }
        example: { type: string, maxLength: 1000 }
        note: { type: string, maxLength: 1000 }
        tags:
          type: array
          items: { type: string }
    Card:
      type: object
      properties:
        id: { type: string, format: uuid }
        deckId: { type: string, format: uuid }
        term: { type: string }
        translation: { type: string }
        example: { type: string }
        note: { type: string }
        tags:
          type: array
          items: { $ref: '#/components/schemas/Tag' }
        state: { $ref: '#/components/schemas/CardState' }
        dueAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    StudyCard:
      allOf:
        - $ref: '#/components/schemas/Card'
        - type: object
          properties:
            intervalSec: { type: integer }
            reps: { type: integer }
            lapses: { type: integer }

    # ── study ──
    StudySession:
      type: object
      properties:
        id: { type: string, format: uuid }
        deckId: { type: string, format: uuid }
        mode: { $ref: '#/components/schemas/StudyMode' }
        status:
          type: string
          enum: [active, finished]
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time, nullable: true }
        reviewedCount: { type: integer }
        correctCount: { type: integer }
        remainingCardIds:
          type: array
          items: { type: string, format: uuid }
    ReviewRequest:
      type: object
      required: [cardId, rating, clientReviewId]
      properties:
        cardId: { type: string, format: uuid }
        rating: { $ref: '#/components/schemas/Rating' }
        answer:
          type: string
          description: Введена відповідь (режим writing) або id обраного варіанта (режим quiz)
        responseTimeMs: { type: integer, minimum: 0 }
        clientReviewId:
          type: string
          format: uuid
          description: Ідентифікатор для ідемпотентності
        reviewedAt:
          type: string
          format: date-time
          description: Час на клієнті (для офлайн-синхронізації)
    ReviewResult:
      type: object
      properties:
        cardId: { type: string, format: uuid }
        isCorrect: { type: boolean, nullable: true }
        newState: { $ref: '#/components/schemas/CardState' }
        intervalSec:
          type: integer
          description: Новий інтервал у секундах
          example: 3600
        nextDueAt: { type: string, format: date-time }
        remainingInSession: { type: integer }

    # ── stats ──
    StatsOverview:
      type: object
      properties:
        currentStreak: { type: integer, example: 12 }
        longestStreak: { type: integer, example: 30 }
        masteredPercent: { type: number, format: float, example: 42.5 }
        totalCards: { type: integer }
        dueToday: { type: integer }
        reviewedToday: { type: integer }
        achievements:
          type: array
          items:
            type: object
            properties:
              code: { type: string }
              title: { type: string }
              earnedAt: { type: string, format: date-time }
    DeckStats:
      type: object
      properties:
        deckId: { type: string, format: uuid }
        totalCards: { type: integer }
        dueCount: { type: integer }
        masteredPercent: { type: number, format: float }
        stateDistribution:
          type: object
          properties:
            new: { type: integer }
            learning: { type: integer }
            review: { type: integer }
            mastered: { type: integer }
        hardestCards:
          type: array
          items:
            type: object
            properties:
              cardId: { type: string, format: uuid }
              term: { type: string }
              lapses: { type: integer }

    # ── catalog ──
    CatalogDeck:
      type: object
      properties:
        id: { type: string, format: uuid }
        sourceDeckId: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        sourceLanguage: { type: string }
        targetLanguage: { type: string }
        cardCount: { type: integer }
        author:
          type: object
          properties:
            id: { type: string, format: uuid }
            displayName: { type: string }
        ratingAvg: { type: number, format: float, example: 4.6 }
        ratingCount: { type: integer }
        copyCount: { type: integer }
        myRating:
          type: integer
          nullable: true
          description: Лише для авторизованих
        isFavorite: { type: boolean }
        isHidden: { type: boolean }
        publishedAt: { type: string, format: date-time }

    # ── import/export ──
    DeckExport:
      type: object
      required: [format, version, deck, cards]
      properties:
        format: { type: string, enum: [flashy-deck] }
        version: { type: integer, example: 1 }
        exportedAt: { type: string, format: date-time }
        deck:
          type: object
          required: [name]
          properties:
            name: { type: string }
            description: { type: string }
            sourceLanguage: { type: string }
            targetLanguage: { type: string }
            tags:
              type: array
              items: { type: string }
        cards:
          type: array
          items:
            type: object
            required: [term, translation]
            properties:
              term: { type: string }
              translation: { type: string }
              example: { type: string }
              note: { type: string }
              tags:
                type: array
                items: { type: string }
              srs:
                type: object
                description: Необов'язковий SRS-стан картки
                properties:
                  state: { $ref: '#/components/schemas/CardState' }
                  intervalSec: { type: integer }
                  dueAt: { type: string, format: date-time }
                  reps: { type: integer }
                  lapses: { type: integer }

    # ── notifications ──
    NotificationSettings:
      type: object
      properties:
        pushEnabled: { type: boolean }
        emailEnabled: { type: boolean }
        dailyReminderTime:
          type: string
          example: '19:00'
          description: Локальний час HH:mm
        timezone: { type: string, example: Europe/Kyiv }

    # ── support ──
    TicketInput:
      type: object
      required: [category, subject, message]
      properties:
        category: { $ref: '#/components/schemas/TicketCategory' }
        subject: { type: string, maxLength: 200 }
        message: { type: string, maxLength: 5000 }
        email:
          type: string
          format: email
          description: Обов'язковий для неавторизованих
    Ticket:
      type: object
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid, nullable: true }
        email: { type: string, format: email }
        category: { $ref: '#/components/schemas/TicketCategory' }
        subject: { type: string }
        status: { $ref: '#/components/schemas/TicketStatus' }
        messages:
          type: array
          items:
            type: object
            properties:
              author:
                type: string
                enum: [user, support]
              text: { type: string }
              createdAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    # ── admin ──
    ModerationReport:
      type: object
      properties:
        id: { type: string, format: uuid }
        catalogDeck: { $ref: '#/components/schemas/CatalogDeck' }
        reporterId: { type: string, format: uuid }
        reason:
          type: string
          enum: [spam, offensive, copyright, other]
        comment: { type: string }
        status:
          type: string
          enum: [open, resolved, dismissed]
        resolution: { type: string }
        createdAt: { type: string, format: date-time }
        resolvedAt: { type: string, format: date-time, nullable: true }
    PlatformStats:
      type: object
      properties:
        totalUsers: { type: integer }
        activeUsers:
          type: object
          properties:
            dau: { type: integer }
            wau: { type: integer }
            mau: { type: integer }
        registrationsByDay:
          type: array
          items:
            type: object
            properties:
              date: { type: string, format: date }
              count: { type: integer }
        popularDecks:
          type: array
          items:
            type: object
            properties:
              catalogDeckId: { type: string, format: uuid }
              name: { type: string }
              copyCount: { type: integer }
              ratingAvg: { type: number, format: float }
        tickets:
          type: object
          properties:
            open: { type: integer }
            processed: { type: integer }

security:
  - cookieAuth: []
  - bearerAuth: []
